# Encore Live — local development stack.
#
#   wordpress  Apache + PHP 8.2 serving the site on :8080
#   db         MySQL 8.0 (InnoDB) — data in the db_data volume
#   phpmyadmin DB browser on :8081
#   mailpit    catches every outgoing email; web UI on :8025
#   wpcli      WP-CLI, run on demand (profile "tools")
#   tools      PHP 8.2 CLI + Composer for PHPCS / PHPUnit (profile "tools")
#
# WordPress core and third-party plugins live in the wp_data volume, NOT in the
# repo. Only our own theme, plugin and mu-plugins are bind-mounted from Git.

name: encore

# Shared DB settings. The official image's wp-config.php reads these with
# getenv_docker(), so the wordpress and wpcli containers see the same config.
x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_NAME: ${DB_NAME}
  WORDPRESS_DB_USER: ${DB_USER}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
  WORDPRESS_TABLE_PREFIX: ${DB_TABLE_PREFIX:-wp_}
  WORDPRESS_DEBUG: ${WP_DEBUG:-}
  WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-local}
  ENCORE_SMTP_HOST: ${ENCORE_SMTP_HOST:-mailpit}
  ENCORE_SMTP_PORT: ${ENCORE_SMTP_PORT:-1025}
  WP_CACHE: ${WP_CACHE:-false}
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_ENVIRONMENT_TYPE', getenv_docker( 'WP_ENVIRONMENT_TYPE', 'production' ) );
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );
    // Cron runs from the "cron" service below, not on page views. Page-view cron
    // also can't work here: it calls the site URL (localhost:8080), which is not
    // reachable from inside the container. Real servers use system cron the same way.
    define( 'DISABLE_WP_CRON', true );
    // Page cache (WP Super Cache) on/off per environment from .env.
    if ( ! defined( 'WP_CACHE' ) ) {
      define( 'WP_CACHE', filter_var( getenv_docker( 'WP_CACHE', 'false' ), FILTER_VALIDATE_BOOLEAN ) );
    }

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment: *wp-env
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/encore-theme:/var/www/html/wp-content/themes/encore-theme
      - ./wp-content/plugins/encore-core:/var/www/html/wp-content/plugins/encore-core
      - ./docker/wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./docker/php/encore.ini:/usr/local/etc/php/conf.d/zz-encore.ini:ro

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 64M

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # Runs due WP-Cron events and Action Scheduler jobs every minute
  # (waitlist notifications, claim expiry, 48 h pending expiry).
  cron:
    image: wordpress:cli-php8.2
    restart: unless-stopped
    user: "33:33"
    depends_on:
      wordpress:
        condition: service_started
    environment:
      <<: *wp-env
      HOME: /tmp
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/encore-theme:/var/www/html/wp-content/themes/encore-theme
      - ./wp-content/plugins/encore-core:/var/www/html/wp-content/plugins/encore-core
      - ./docker/wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          if wp core is-installed >/dev/null 2>&1; then
            wp cron event run --due-now --quiet
            wp action-scheduler run --batch-size=25 --quiet 2>/dev/null || true
          fi
          sleep 60
        done

  # Run with: scripts/encore.(sh|ps1) wp <args>
  wpcli:
    image: wordpress:cli-php8.2
    profiles: ["tools"]
    # The CLI image is Alpine (www-data = uid 82); the Apache image is Debian
    # (www-data = uid 33). Running as 33 keeps file ownership consistent.
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp-env
      HOME: /tmp
      WP_URL: ${WP_URL}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/encore-theme:/var/www/html/wp-content/themes/encore-theme
      - ./wp-content/plugins/encore-core:/var/www/html/wp-content/plugins/encore-core
      - ./docker/wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./scripts:/scripts:ro

  # Run with: scripts/encore.(sh|ps1) phpcs | test | composer <args>
  tools:
    build: ./docker/tools
    image: encore-tools:php8.2
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - .:/app
      # vendor/ lives in a Linux volume: unpacking thousands of small files
      # through a Windows bind mount took >300s and timed Composer out.
      - tools_vendor:/app/vendor

volumes:
  db_data:
  wp_data:
  tools_vendor:

# Encore Live: server-level hardening (Apache). Nginx equivalents: docs/SECURITY.md.

# Don't advertise versions.
ServerTokens Prod
ServerSignature Off

# Baseline security headers on every response, including cached HTML and assets.
<IfModule mod_headers.c>
    # WordPress also sends some of these (e.g. on wp-login.php). Two copies of
    # X-Frame-Options can make browsers treat it as invalid, so drop the
    # application's copy ("onsuccess" table) and set one value ("always" table).
    Header unset X-Content-Type-Options
    Header unset X-Frame-Options
    Header unset Referrer-Policy
    Header unset Permissions-Policy
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)"
    Header always unset X-Powered-By
    Header unset X-Powered-By
</IfModule>

# XML-RPC is not used: refuse it before PHP runs (cheapest possible rejection).
<Files "xmlrpc.php">
    Require all denied
</Files>

# Never serve dotfiles (.env, .git) or WordPress debug logs.
<FilesMatch "^\.|debug\.log$">
    Require all denied
</FilesMatch>
